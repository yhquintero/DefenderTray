version: 2
updates:
  # Acciones de la integración continua: es la única dependencia que tiene
  # este repositorio (los scripts usan solo la biblioteca de Windows).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Havana
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
